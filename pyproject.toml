[project]
name = "virtual-accounts-api"
version = "0.1.2"
description = "Virtual accounts API on a master FBO with a double-entry ledger"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<0.120",
    "httpx>=0.26",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary,pool]>=3.1",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-ulid>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.26",
    "ruff>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
